schema_version: 1
scope_id: SCOPE-001
updated_on: "2026-08-11"
purpose: authoritative active priorities task ownership and shared write locks

authority:
  producer: producer_user
  design_owner: null
  engineering_owner: codex_primary
  art_owner: null
  pm_execution_operator: null
  default_write_scope: none

rag:
  required: true
  status: SEE_GATE_RECEIPT
  gate_receipt: tmp/rag/receipts/rag-gate.json
  live_task_receipt_dir: tmp/rag/receipts/tasks
  live_context_dir: tmp/rag/context
  dynamic_state_is_receipt_backed: true
  refresh_required_after_source_change: true

priority_order:
  source: PM/feature_progress.xlsx
  same_priority_tiebreaker: feature_id_ascending
  completed_features_last: true
  skip_only_for: [unmet_dependency, shared_lock, safety_blocker]

monitoring:
  active_batch_nodes: []
  active_batch_tasks: []
  dependency_paused_nodes: []
  deferred_paused_nodes: []
  exception_interval_minutes: 30
  progress_refresh_interval_hours: 6
  healthy_result: quiet

feature_progress:
  workbook: PM/feature_progress.xlsx
  first_sheet: Nine Dimensions
  row_definition: one_complete_feature
  dimensions: [design_document, numeric_table, code, scene, UI, icon_or_image, scene_integration, image_integration, UI_integration]
  not_applicable_display: Not needed
  source_collection: [functional_documents, numeric_or_config_tables, version_plan, filed_producer_directives, latest_accountable_receipts]

active_modules:
  - feature_id: F-ZC-RELEASE-20260811
    task_id: REQ-20260811-ANIMAL-GROUNDLINE-REPACKAGE-PUBLISH
    title: animal_groundline_repackage_and_git_publication
    phase: release
    owner: codex_primary
    branch: codex/animal-art-integration-20260811
    state: RUNNING
    evidence_root: docs/receipts/F-ZC-RELEASE-20260811-REPACKAGE-READ-ONLY-005.md
queued_modules: []

shared_locks:
  release_artifacts:
    owner: codex_primary
    task_id: REQ-20260811-ANIMAL-GROUNDLINE-REPACKAGE-PUBLISH
    paths:
      - build/windows/*
      - build/android/*
      - build/web/*
    acquired_on: "2026-08-11"
  git_publication:
    owner: codex_primary
    task_id: REQ-20260811-ANIMAL-GROUNDLINE-REPACKAGE-PUBLISH
    paths:
      - refs/heads/codex/animal-art-integration-20260811
      - refs/heads/main
      - origin/codex/animal-art-integration-20260811
      - origin/main
    acquired_on: "2026-08-11"
