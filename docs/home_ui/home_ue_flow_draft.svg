<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="2500" viewBox="0 0 1760 2500">
<rect width="100%" height="100%" fill="#f8fafb"/>
<text x="56" y="70" font-family="Microsoft YaHei" font-size="42" fill="#253449">家园 UE 总流程  v1.1</text>
<text x="56" y="114" font-family="Microsoft YaHei" font-size="26" fill="#76613f">低保真评审草稿  本地 SVG 可编辑  Figma 保存与回读待完成</text>
<g id="H00"><rect x="56" y="164" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="70" y="178" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="86" y="328" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="88" y="221" font-family="Microsoft YaHei" font-size="32" fill="#253449">H00 大厅入口</text>
<text x="88" y="297" font-family="Microsoft YaHei" font-size="27" fill="#253449">顶部  金币拥有量    抽卡券拥有量</text>
<text x="106" y="375" font-family="Microsoft YaHei" font-size="29" fill="#253449">保留当前大厅主体</text>
<text x="88" y="524" font-family="Microsoft YaHei" font-size="28" fill="#315c84">左下角 家园  [红点]</text>
<text x="88" y="593" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">点击家园 → H01；有补领或可买地块时红点</text>
</g>
<g id="H01"><rect x="906" y="164" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="920" y="178" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="936" y="328" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="938" y="221" font-family="Microsoft YaHei" font-size="32" fill="#253449">H01 家园主页</text>
<text x="938" y="297" font-family="Microsoft YaHei" font-size="27" fill="#253449">顶部  金币拥有量    抽卡券拥有量</text>
<text x="956" y="375" font-family="Microsoft YaHei" font-size="29" fill="#253449">彩色六边形建筑与边线道路</text>
<text x="956" y="414" font-family="Microsoft YaHei" font-size="29" fill="#253449">中心主城堡  居民随机活动</text>
<text x="938" y="524" font-family="Microsoft YaHei" font-size="28" fill="#315c84">拖动地图；有收益时 [领取收益]</text>
<text x="938" y="593" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">有收益自动进入 H04；锁格见 H02；已有格查看 H03</text>
</g>
<g id="H02"><rect x="56" y="744" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="70" y="758" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="86" y="908" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="88" y="801" font-family="Microsoft YaHei" font-size="32" fill="#253449">H02 锁格点击反馈</text>
<text x="88" y="877" font-family="Microsoft YaHei" font-size="27" fill="#253449">无色地块  类型剪影  金币价格</text>
<text x="106" y="955" font-family="Microsoft YaHei" font-size="29" fill="#253449">价格可读：点击校验邻接和余额</text>
<text x="106" y="994" font-family="Microsoft YaHei" font-size="29" fill="#253449">价格不可读：首击居中，不扣款</text>
<text x="88" y="1104" font-family="Microsoft YaHei" font-size="28" fill="#315c84">居中后再点建造；不足只短提示</text>
<text x="88" y="1173" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">不打开锁格详情；成功赠 1 券；无升级玩法</text>
</g>
<g id="H03"><rect x="906" y="744" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="920" y="758" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="936" y="908" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="938" y="801" font-family="Microsoft YaHei" font-size="32" fill="#253449">H03 已拥有详情</text>
<text x="938" y="877" font-family="Microsoft YaHei" font-size="27" fill="#253449">温馨小屋    已解锁</text>
<text x="956" y="955" font-family="Microsoft YaHei" font-size="29" fill="#253449">类型 / 容量 / 日间夜间活动</text>
<text x="956" y="994" font-family="Microsoft YaHei" font-size="29" fill="#253449">日产物品图标与数量  明日开始</text>
<text x="938" y="1104" font-family="Microsoft YaHei" font-size="28" fill="#315c84">[关闭]</text>
<text x="938" y="1173" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">不显示价值；关闭回 H01；城堡列固定两种收益</text>
</g>
<g id="H04"><rect x="56" y="1324" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="70" y="1338" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="86" y="1488" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="88" y="1381" font-family="Microsoft YaHei" font-size="32" fill="#253449">H04 收益清单</text>
<text x="88" y="1457" font-family="Microsoft YaHei" font-size="27" fill="#253449">家园收益    最近 1～3 天</text>
<text x="106" y="1535" font-family="Microsoft YaHei" font-size="29" fill="#253449">软绒枕头 ×2    美味餐篮 ×1</text>
<text x="106" y="1574" font-family="Microsoft YaHei" font-size="29" fill="#253449">城堡  金币 ×300   抽卡券 ×3</text>
<text x="88" y="1684" font-family="Microsoft YaHei" font-size="28" fill="#315c84">[上一页] 1/2 [下一页]   [全部兑换]</text>
<text x="88" y="1753" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">确认 → H06 等待；关闭保留未领 → H01</text>
</g>
<g id="H05"><rect x="906" y="1324" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="920" y="1338" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="936" y="1488" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="938" y="1381" font-family="Microsoft YaHei" font-size="32" fill="#253449">H05 兑换结果</text>
<text x="938" y="1457" font-family="Microsoft YaHei" font-size="27" fill="#253449">家园收获已到账</text>
<text x="956" y="1535" font-family="Microsoft YaHei" font-size="29" fill="#253449">金币图标  合计随机金币</text>
<text x="956" y="1574" font-family="Microsoft YaHei" font-size="29" fill="#253449">抽卡券图标  合计获得数量</text>
<text x="938" y="1684" font-family="Microsoft YaHei" font-size="28" fill="#315c84">[收下]</text>
<text x="938" y="1753" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">回 H01 更新余额与红点；同日重进不重复发奖</text>
</g>
<g id="H06"><rect x="56" y="1904" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="70" y="1918" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="86" y="2068" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="88" y="1961" font-family="Microsoft YaHei" font-size="32" fill="#253449">H06 请求反馈</text>
<text x="88" y="2037" font-family="Microsoft YaHei" font-size="27" fill="#253449">保留原家园或收益面板</text>
<text x="106" y="2115" font-family="Microsoft YaHei" font-size="29" fill="#253449">防重复提交；操作失败短提示</text>
<text x="106" y="2154" font-family="Microsoft YaHei" font-size="29" fill="#253449">不显示常驻连接条或重试连接按钮</text>
<text x="88" y="2264" font-family="Microsoft YaHei" font-size="28" fill="#315c84">操作完成或短提示消失</text>
<text x="88" y="2333" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">失败不扣不发，重新操作不重复奖励</text>
</g>
<g id="H07"><rect x="906" y="1904" width="798" height="516" rx="22" fill="white" stroke="#b6c5d1" stroke-width="3"/>
<rect x="920" y="1918" width="770" height="64" rx="12" fill="#dfeaf0"/>
<rect x="936" y="2068" width="738" height="144" rx="12" fill="#edf1e3" stroke="#cbd5b9" stroke-width="2"/>
<text x="938" y="1961" font-family="Microsoft YaHei" font-size="32" fill="#253449">H07 休息与重进</text>
<text x="938" y="2037" font-family="Microsoft YaHei" font-size="27" fill="#253449">夜晚  动物沿道路回家</text>
<text x="956" y="2115" font-family="Microsoft YaHei" font-size="29" fill="#253449">抵达门口后隐藏</text>
<text x="956" y="2154" font-family="Microsoft YaHei" font-size="29" fill="#253449">完成活动冒短暂表情气泡</text>
<text x="938" y="2264" font-family="Microsoft YaHei" font-size="28" fill="#315c84">[大厅]    关闭与后台不累计活动奖励</text>
<text x="938" y="2333" font-family="Microsoft YaHei" font-size="25" fill="#5f6b78">再进 H01 读取当前日；动物表现不控制结算</text>
</g>
<metadata id="transition-map">[[0, 1, &quot;点击家园&quot;], [1, 2, &quot;点未解锁地块&quot;], [1, 3, &quot;点已拥有地块&quot;], [1, 4, &quot;有收益 / 点收益&quot;], [4, 6, &quot;确认兑换&quot;], [6, 5, &quot;提交成功&quot;], [5, 1, &quot;收下并返回&quot;], [6, 1, &quot;取消 / 返回&quot;], [7, 1, &quot;次日或再次进入&quot;]]</metadata></svg>